version: 2

models:
  - name: fct_orders
    columns:
      - name: order_id
        data_tests:
          - unique
          - not_null

      - name: restaurant_id
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_restaurant')
              field: restaurant_id
      - name: cuisine_id
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_cuisine')
              field: cuisine_id
  

